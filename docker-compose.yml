version: '3.8'

services:
  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REPLICA_URLS=http://replica1:4001,http://replica2:4002,http://replica3:4003
      - GATEWAY_URL=http://gateway:3000
    volumes:
      - ./gateway:/app
      - ./frontend:/frontend
      - /app/node_modules
    depends_on:
      - replica1
      - replica2
      - replica3
    networks:
      - drawnet

  replica1:
    build: ./replica1
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - REPLICA_ID=replica1
      - PEERS=http://replica2:4002,http://replica3:4003
      - GATEWAY_URL=http://gateway:3000
    volumes:
      - ./replica1:/app
      - /app/node_modules
    networks:
      - drawnet

  replica2:
    build: ./replica2
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - REPLICA_ID=replica2
      - PEERS=http://replica1:4001,http://replica3:4003
      - GATEWAY_URL=http://gateway:3000
    volumes:
      - ./replica2:/app
      - /app/node_modules
    networks:
      - drawnet

  replica3:
    build: ./replica3
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - REPLICA_ID=replica3
      - PEERS=http://replica1:4001,http://replica2:4002
      - GATEWAY_URL=http://gateway:3000
    volumes:
      - ./replica3:/app
      - /app/node_modules
    networks:
      - drawnet

networks:
  drawnet:
    driver: bridge
